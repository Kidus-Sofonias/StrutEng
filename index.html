<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon ships as a transparent PNG in two contrast variants; the
         scheme links handle first paint, src/favicon.js owns it at runtime
         so every browser (including ones that ignore `media` on icons)
         always ends up with a legible mark. Larger 192/512 sizes for
         pinned tabs / retina; 180 apple-touch-icon is intentionally opaque. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicons/favicon-64.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicons/favicon-64-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://strutengineering.com/" />
    <!-- Fonts: preconnect + stylesheet in head instead of a render-blocking CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&display=swap" />
    <!-- Home hero is the LCP element — hint the preload scanner early -->
    <link rel="preload" as="image" href="/images/home-hero.jpg" fetchpriority="high" />
    <meta name="theme-color" content="#1A1714" />
    <meta name="description" content="Strut Engineering Plc — Ethiopian engineering firm since 2015. Structural, architectural, infrastructure, industrial and MEP engineering design across Ethiopia." />
    <meta name="keywords" content="structural engineering, Ethiopia, Addis Ababa, construction, building design, MEP, architectural design, infrastructure" />
    <meta property="og:title" content="Strut Engineering Plc — Engineering Design & Consulting" />
    <meta property="og:description" content="Engineering solutions for building design — structural, architectural, infrastructure, industrial and MEP services across Ethiopia since 2015." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strut Engineering Plc" />
    <meta property="og:url" content="https://strutengineering.com/" />
    <meta property="og:image" content="https://strutengineering.com/images/home-hero.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Strut Engineering Plc" />
    <meta name="twitter:description" content="Engineering solutions for building design — structural, architectural, infrastructure, industrial and MEP services across Ethiopia since 2015." />
    <meta name="twitter:image" content="https://strutengineering.com/images/home-hero.jpg" />
    <title>Strut Engineering Plc — Engineering Design & Consulting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
